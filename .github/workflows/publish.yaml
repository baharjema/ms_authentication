name: Publish to pub.dev

# Trigger action ini hanya ketika Anda membuat/push sebuah Tag Git
# Contoh: git tag v1.0.0 lalu git push origin v1.0.0
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*' # Akan trigger pada tag seperti v1.0.0, v2.1.3+1, dst.

jobs:
  publish:
    name: Publish Package
    runs-on: ubuntu-latest
    
    # PERMISSIONS INI SANGAT WAJIB UNTUK OIDC PUB.DEV
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x' # Gunakan versi Flutter terbaru (stable)
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # (Opsional) Memastikan kode sudah di-format dengan benar
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      # (Opsional) Memastikan tidak ada error/warning pada kode
      - name: Analyze project
        run: flutter analyze

      # (Opsional) Menjalankan unit test jika ada
      - name: Run tests
        run: flutter test

      # LANGKAH INTI: Publish ke pub.dev
      # --force digunakan agar CI tidak menunggu input "Y/N"
      - name: Publish to pub.dev
        run: dart pub publish --force